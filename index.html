<!doctype html>
<html lang="pt-BR" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerador de Chamada Por Grupo</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700;800&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Outfit', sans-serif; }
    .font-display { font-family: 'Fraunces', serif; }
    .grain {
      background-image: radial-gradient(circle at 1px 1px, rgba(0,0,0,0.03) 1px, transparent 0);
      background-size: 20px 20px;
    }
    @keyframes slideIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-slide { animation: slideIn 0.4s ease-out both; }
    
    @media print {
      .no-print { display: none !important; }
      body { background: white !important; margin: 0; padding: 0; }
      .print-area { box-shadow: none !important; width: 100%; }
      .max-w-6xl { max-width: 100% !important; padding: 0 !important; }
      .grid { display: block !important; }
      .bg-white { border: 1px solid #eee !important; margin-bottom: 20px; page-break-inside: avoid; }
    }
  </style>
</head>
<body class="h-full grain" style="background: linear-gradient(135deg, #fef3e8 0%, #fde4cf 50%, #fbd5b5 100%);">
  <main class="h-full w-full overflow-auto">
    <div class="max-w-6xl mx-auto px-6 py-10">
      <header class="mb-8 no-print">
        <div class="flex items-center gap-3 mb-2">
          <div class="w-11 h-11 rounded-xl flex items-center justify-center shadow-lg" style="background: linear-gradient(135deg, #ea580c, #c2410c);">
            <i data-lucide="clipboard-check" class="text-white" style="width:22px;height:22px;"></i>
          </div>

        </div>
        <h1 class="font-display text-5xl md:text-6xl font-bold text-stone-900 leading-tight">Gerador de Chamada</h1>
      </header>

      <section class="no-print bg-white/70 backdrop-blur rounded-3xl p-6 md:p-8 shadow-xl border border-white mb-8">
        <div class="grid md:grid-cols-3 gap-5 mb-6">
          <div>
            <label class="block text-sm font-semibold text-stone-700 mb-2"><i data-lucide="users" class="inline mr-1" style="width:14px;height:14px;"></i> Turma</label>
            <select id="turma-select" class="w-full px-4 py-3 rounded-xl border-2 border-stone-200 bg-white font-medium text-stone-800 focus:outline-none focus:border-orange-500 transition"> 
                <option value="1w">1º W Info</option> 
                <option value="1xrh">1º X RH</option> 
                <option value="2w">2º W Info</option> 
            </select>
          </div>
          <div>
            <label class="block text-sm font-semibold text-stone-700 mb-2"><i data-lucide="user-check" class="inline mr-1" style="width:14px;height:14px;"></i> Grupo</label>
            <select id="grupo-select" class="w-full px-4 py-3 rounded-xl border-2 border-stone-200 bg-white font-medium text-stone-800 focus:outline-none focus:border-orange-500 transition"> 
                <option value="A">Grupo A</option> 
                <option value="B">Grupo B</option> 
            </select>
          </div>
          <div>
            <label class="block text-sm font-semibold text-stone-700 mb-2"><i data-lucide="calendar" class="inline mr-1" style="width:14px;height:14px;"></i> Data</label>
            <input id="data-input" type="date" class="w-full px-4 py-3 rounded-xl border-2 border-stone-200 bg-white font-medium focus:outline-none focus:border-orange-500 transition">
          </div>
        </div>

        <div class="bg-white/50 rounded-2xl p-4 mb-6">
          <label class="block text-sm font-semibold text-stone-700 mb-3"><i data-lucide="book-open" class="inline mr-1" style="width:14px;height:14px;"></i> Selecione as aulas</label>
          <div class="grid grid-cols-5 gap-2">
            <label class="flex items-center gap-2 p-2 rounded-lg hover:bg-orange-50 cursor-pointer"><input type="checkbox" class="aula-check w-4 h-4 accent-orange-600" value="1" checked> <span class="text-sm font-medium">1ª</span></label>
            <label class="flex items-center gap-2 p-2 rounded-lg hover:bg-orange-50 cursor-pointer"><input type="checkbox" class="aula-check w-4 h-4 accent-orange-600" value="2" checked> <span class="text-sm font-medium">2ª</span></label>
            <label class="flex items-center gap-2 p-2 rounded-lg hover:bg-orange-50 cursor-pointer"><input type="checkbox" class="aula-check w-4 h-4 accent-orange-600" value="3" checked> <span class="text-sm font-medium">3ª</span></label>
            <label class="flex items-center gap-2 p-2 rounded-lg hover:bg-orange-50 cursor-pointer"><input type="checkbox" class="aula-check w-4 h-4 accent-orange-600" value="4" checked> <span class="text-sm font-medium">4ª</span></label>
            <label class="flex items-center gap-2 p-2 rounded-lg hover:bg-orange-50 cursor-pointer"><input type="checkbox" class="aula-check w-4 h-4 accent-orange-600" value="5" checked> <span class="text-sm font-medium">5ª</span></label>
          </div>
        </div>

        <div class="flex flex-wrap gap-3">
          <button id="gerar-btn" class="flex items-center gap-2 px-6 py-3 rounded-xl font-semibold text-white shadow-lg hover:scale-[1.02] transition" style="background: linear-gradient(135deg, #ea580c, #c2410c);"><i data-lucide="sparkles" style="width:18px;height:18px;"></i> Gerar</button>
          <button id="marcar-todos" class="px-5 py-3 rounded-xl font-semibold bg-emerald-600 hover:bg-emerald-700 text-white transition">Presença Total</button>
          <button id="marcar-faltas-todas" class="px-5 py-3 rounded-xl font-semibold bg-red-600 hover:bg-red-700 text-white transition">Falta Total</button>
          <button id="print-btn" class="flex items-center gap-2 px-5 py-3 rounded-xl font-semibold bg-stone-800 text-white hover:bg-black transition"><i data-lucide="printer" style="width:18px;height:18px;"></i> Imprimir</button>
          <button id="export-json-btn" class="flex items-center gap-2 px-5 py-3 rounded-xl font-semibold bg-blue-600 text-white hover:bg-blue-700 transition"><i data-lucide="file-json" style="width:18px;height:18px;"></i> JSON</button>
          <button id="export-csv-btn" class="flex items-center gap-2 px-5 py-3 rounded-xl font-semibold bg-green-600 text-white hover:bg-green-700 transition"><i data-lucide="file-text" style="width:18px;height:18px;"></i> CSV</button>
        </div>
      </section>

      <section id="output" class="print-area"></section>
    </div>
  </main>

let presencas = {};

function getKey(turma, data, aula, rm) { return `${turma}_${data}_${aula}_${rm}`; }

function getAulasSelecionadas() {
  return Array.from(document.querySelectorAll('.aula-check:checked')).map(cb => cb.value);
}

function geratNomeArquivo(extensao) {
  const turma = document.getElementById('turma-select').value;
  const grupo = document.getElementById('grupo-select').value;
  const dataVal = document.getElementById('data-input').value; // YYYY-MM-DD
  const aulas = getAulasSelecionadas();

  // Formatar aulas: 1ª_3ª_4ªaula
  const strAulas = aulas.map(a => `${a}ª`).join('_') + 'aula';

  // Formatar data: DD-MM-YYYY
  let dataFormatada = "";
  if (dataVal) {
    const partes = dataVal.split('-');
    if (partes.length === 3) {
      dataFormatada = `${partes[2]}-${partes[1]}-${partes[0]}`;
    }
  }

  return `${strAulas}-${turma}-${grupo}_${dataFormatada}.${extensao}`;
}

function gerarChamada() {
  const turma = document.getElementById('turma-select').value;
  const grupoSelecionado = document.getElementById('grupo-select').value;
  const data = document.getElementById('data-input').value;
  const aulas = getAulasSelecionadas();
  const output = document.getElementById('output');

  if (!data || aulas.length === 0) {
    output.innerHTML = `<div class="p-4 bg-amber-50 text-amber-800 rounded-xl border border-amber-200">Selecione data e pelo menos uma aula.</div>`;
    return;
  }

  const dadosTurma = alunos[turma];
  const listaAlunos = dadosTurma.alunos.filter(a => a.grupo === grupoSelecionado);

  let html = `<div class="bg-white rounded-3xl p-8 mb-6 shadow-sm border border-stone-100">
                <h2 class="text-3xl font-bold font-display">${dadosTurma.nome} - Grupo ${grupoSelecionado}</h2>
                <p class="text-stone-500">${data} | Aulas: ${aulas.join('ª, ')}ª</p>
              </div>
              <div class="grid gap-6">`;

  if (listaAlunos.length === 0) {
    html += `<div class="p-6 bg-white rounded-2xl border border-stone-100 text-stone-500">Nenhum aluno encontrado para este grupo.</div></div>`;
    output.innerHTML = html;
    return;
  }

  html += `<div class="bg-white rounded-2xl shadow-sm border border-stone-100 overflow-hidden">
            <div class="px-6 py-4 bg-stone-50 border-b border-stone-100 font-bold">Grupo ${grupoSelecionado}</div>
            <table class="w-full text-sm">
              <thead><tr class="text-left bg-stone-50/50">
                <th class="p-3">RM</th><th class="p-3">Nome</th>${aulas.map(a => `<th class="p-3 text-center">${a}ª</th>`).join('')}
              </tr></thead>
              <tbody>`;
  
  listaAlunos.forEach(al => {
    html += `<tr class="border-t border-stone-50">
              <td class="p-3 font-mono">${al.rm}</td>
              <td class="p-3 font-medium">${al.nome}</td>
              ${aulas.map(a => {
                const key = getKey(turma, data, a, al.rm);
                const isFalta = presencas[key] === 'ausente';
                return `<td class="p-2 text-center no-print">
                          <button onclick="togglePresenca('${key}')" class="w-8 h-8 rounded transition font-semibold ${isFalta ? 'bg-red-500 text-white' : 'bg-stone-100 text-stone-700 hover:bg-stone-200'}">${isFalta ? 'F' : 'P'}</button>
                        </td>
                        <td class="hidden print:table-cell p-2 text-center border font-mono">${isFalta ? 'F' : '.'}</td>`;
              }).join('')}
            </tr>`;
  });
  html += `</tbody></table></div></div>`;

  output.innerHTML = html;
  lucide.createIcons();
}

function togglePresenca(key) {
  presencas[key] = presencas[key] === 'ausente' ? 'presente' : 'ausente';
  gerarChamada();
}

// EXPORTAR CSV
document.getElementById('export-csv-btn').onclick = () => {
  const turma = document.getElementById('turma-select').value;
  const grupo = document.getElementById('grupo-select').value;
  const data = document.getElementById('data-input').value;
  const aulas = getAulasSelecionadas();
  
  if (!data || aulas.length === 0) {
    alert("Por favor, selecione a data e as aulas antes de exportar.");
    return;
  }

  const listaAlunos = alunos[turma].alunos.filter(a => a.grupo === grupo);

  let csv = "﻿"; // BOM UTF-8
  csv += `Chamada: ${alunos[turma].nome} - Grupo ${grupo} - Data: ${data}

`;
  csv += `RM;Nome;Grupo;${aulas.map(a => `Aula ${a}`).join(';')};Total Faltas
`;

  listaAlunos.forEach(al => {
    let faltas = 0;
    const linhaAulas = aulas.map(a => {
      if (presencas[getKey(turma, data, a, al.rm)] === 'ausente') {
        faltas++; return "F";
      }
      return "P";
    }).join(';');
    csv += `${al.rm};"${al.nome}";${al.grupo};${linhaAulas};${faltas}
`;
  });

  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = geratNomeArquivo('csv');
  a.click();
};

// EXPORTAR JSON
document.getElementById('export-json-btn').onclick = () => {
  const turma = document.getElementById('turma-select').value;
  const grupo = document.getElementById('grupo-select').value;
  const data = document.getElementById('data-input').value;
  const aulas = getAulasSelecionadas();

  if (!data || aulas.length === 0) {
    alert("Por favor, selecione a data e as aulas antes de exportar.");
    return;
  }
  
  const listaAlunos = alunos[turma].alunos.filter(a => a.grupo === grupo);

  const relatorio = {
    turma: alunos[turma].nome,
    grupo: grupo,
    data: data,
    alunos: listaAlunos.map(al => ({
      rm: al.rm,
      nome: al.nome,
      grupo: al.grupo,
      presencas: aulas.map(a => ({ aula: a, status: presencas[getKey(turma, data, a, al.rm)] || 'presente' }))
    }))
  };

  const blob = new Blob([JSON.stringify(relatorio, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = geratNomeArquivo('json');
  a.click();
};

// IMPRIMIR
document.getElementById('print-btn').onclick = () => window.print();

// MARCAR TODOS COMO PRESENTE
document.getElementById('marcar-todos').onclick = () => {
  presencas = {};
  gerarChamada();
};

// MARCAR TODOS COMO FALTA
document.getElementById('marcar-faltas-todas').onclick = () => {
  const turma = document.getElementById('turma-select').value;
  const grupo = document.getElementById('grupo-select').value;
  const data = document.getElementById('data-input').value;
  const aulas = getAulasSelecionadas();

  if (!data || aulas.length === 0) {
    alert("Por favor, selecione a data e as aulas primeiro.");
    return;
  }

  const listaAlunos = alunos[turma].alunos.filter(a => a.grupo === grupo);
  listaAlunos.forEach(al => {
    aulas.forEach(a => {
      const key = getKey(turma, data, a, al.rm);
      presencas[key] = 'ausente';
    });
  });

  gerarChamada();
};

// Inicialização
document.getElementById('gerar-btn').onclick = gerarChamada;
document.addEventListener('DOMContentLoaded', () => {
  const today = new Date().toISOString().split('T')[0];
  document.getElementById('data-input').value = today;
  lucide.createIcons();
});
